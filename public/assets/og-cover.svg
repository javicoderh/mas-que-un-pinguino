<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Es más que un pingüino</title>
  <desc id="desc">Imagen Open Graph de la campaña ciudadana por la protección del pingüino de Humboldt.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="45%" stop-color="#07131D" />
      <stop offset="100%" stop-color="#0A2430" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE88B" />
      <stop offset="50%" stop-color="#FFA2D1" />
      <stop offset="100%" stop-color="#38B6FF" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="920" cy="130" r="180" fill="#38B6FF" opacity="0.16" />
  <circle cx="1060" cy="540" r="180" fill="#FFA2D1" opacity="0.14" />
  <circle cx="160" cy="90" r="120" fill="#FFE88B" opacity="0.08" />
  <rect x="70" y="86" width="170" height="170" rx="85" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.16)" />
  <text x="320" y="210" fill="#FFE88B" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">
    CAMPAÑA CIUDADANA
  </text>
  <text x="70" y="360" fill="url(#accent)" font-family="Arial, sans-serif" font-size="88" font-weight="800">
    Es más que
  </text>
  <text x="70" y="456" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="88" font-weight="800">
    un pingüino
  </text>
  <text x="72" y="534" fill="#C9D3DE" font-family="Arial, sans-serif" font-size="28">
    Lee la carta, firma y comparte antes del 25 de abril.
  </text>
</svg>
